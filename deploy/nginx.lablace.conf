# nginx site for the Lab-Lace website and portal (template: replace example.com, then see docs/PORTAL.md).
#
#   /          -> the landing site        (packages/frontend/dist/index.html)
#   /portal/   -> the signed-in portal    (packages/frontend/dist/portal/index.html)
#   /api/      -> the Express API under PM2 on 127.0.0.1:8787
#
# Put this at /etc/nginx/sites-available/lablace, link it into sites-enabled, then get the certificate with
#   sudo certbot --nginx -d example.com -d www.example.com
# (certbot fills in the ssl_certificate lines). Sign-in cookies are Secure, so the site must be served over HTTPS.

server {
  listen 80;
  server_name example.com www.example.com;
  return 301 https://$host$request_uri;
}

server {
  listen 443 ssl http2;
  server_name example.com www.example.com;

  # ssl_certificate / ssl_certificate_key are added by certbot

  root /var/www/lablace;          # deploy.ps1 copies packages/frontend/dist here
  index index.html;

  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options SAMEORIGIN always;
  # Turn this on once the site works over HTTPS for good (browsers remember it):
  # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # The API. proxy_buffering off + the long read timeout keep the live-update stream (Server-Sent Events) open.
  location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    client_max_body_size 3m;      # a studio design can be a few hundred elements (the API allows 2 MB)
  }

  # Hashed build files never change, so browsers may keep them for a year.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Each document has its own hash routes (#/work, #/requests/...), so no SPA fallback rules are needed.
  location /portal/ {
    try_files $uri $uri/ /portal/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
